name: Auto-Schedule Clips

on:
  schedule:
    - cron: "0 6,10,14,18,22 * * *"   # 5× daily: 6AM, 10AM, 2PM, 6PM, 10PM UTC
  workflow_dispatch:                    # manual trigger from GitHub Actions UI

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger schedule endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "https://opusclipping.vercel.app/api/cron/schedule")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Schedule endpoint returned HTTP $status — failing job"
            exit 1
          fi
