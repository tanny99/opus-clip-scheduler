name: Auto-Schedule Clips

on:
  schedule:
    - cron: "0 * * * *"    # trigger every hour as a watchdog
  workflow_dispatch:        # manual trigger from GitHub Actions UI

jobs:
  schedule-until-done:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # up to ~5h50m (GitHub max is 6h)

    steps:
      - name: Schedule all unposted clips (loop until done)
        run: |
          MAX_RUNS=50          # safety cap: 50 × ~5min = ~4h max
          WAIT_SECS=30         # wait 30s between runs (let token bucket refill)
          ITERATION=0

          while [ $ITERATION -lt $MAX_RUNS ]; do
            ITERATION=$((ITERATION + 1))
            echo ""
            echo "━━━ Run $ITERATION / $MAX_RUNS  $(date -u '+%H:%M:%S UTC') ━━━"

            response=$(curl -s -w "\n%{http_code}" \
              --max-time 320 \
              "https://opusclipping.vercel.app/api/cron/schedule")

            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)

            echo "HTTP $http_code"
            echo "$body"

            if [ "$http_code" -ge 300 ]; then
              echo "⚠ Error response (HTTP $http_code) — stopping."
              exit 1
            fi

            # Parse remaining count from JSON response
            remaining=$(echo "$body" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('remaining',0))" \
              2>/dev/null || echo "0")

            scheduled=$(echo "$body" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('scheduled',0))" \
              2>/dev/null || echo "0")

            echo "✓ Scheduled this run: $scheduled  |  Remaining: $remaining"

            if [ "$remaining" = "0" ]; then
              echo ""
              echo "✅ All clips scheduled! Nothing left to do."
              break
            fi

            echo "⏳ Waiting ${WAIT_SECS}s before next run..."
            sleep $WAIT_SECS
          done

          echo ""
          echo "Done after $ITERATION run(s)."
